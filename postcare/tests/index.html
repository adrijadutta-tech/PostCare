<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostCare - Triage Unit Tests</title>
  <style>
    :root {
      --primary: #12474B;
      --teal: #2A9D8F;
      --bg: #F8FAFA;
      --card-bg: #FFFFFF;
      --text: #1C2E2E;
      --green: #1B8A5A;
      --green-bg: #E8F6EF;
      --amber: #D97706;
      --amber-bg: #FEF3C7;
      --red: #DC2626;
      --red-bg: #FEE2E2;
      --border: #D1E5E4;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(18, 71, 75, 0.08);
      border: 1px solid var(--border);
      padding: 28px;
    }
    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: Georgia, serif;
      color: var(--primary);
      margin: 0 0 8px 0;
      font-size: 26px;
    }
    .summary-card {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .stat-pill {
      flex: 1;
      min-width: 140px;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      background: #F1F7F7;
      border: 1px solid var(--border);
    }
    .stat-val {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-val.passed { color: var(--green); }
    .stat-val.failed { color: var(--red); }
    .stat-label {
      font-size: 13px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .test-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    .test-table th, .test-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .test-table th {
      background: #E8F3F2;
      color: var(--primary);
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge.pass { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
    .badge.fail { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
    .badge.level-RED { background: var(--red-bg); color: var(--red); }
    .badge.level-AMBER { background: var(--amber-bg); color: var(--amber); }
    .badge.level-GREEN { background: var(--green-bg); color: var(--green); }
    .disclaimer-box {
      margin-top: 24px;
      padding: 14px;
      background: #FFFBEB;
      border-left: 4px solid var(--amber);
      border-radius: 4px;
      font-size: 13px;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: var(--teal); }
    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PostCare Clinical Triage Unit Tests</h1>
      <p style="margin: 0; color: #555;">Automated boundary-case and trend-rule validation suite.</p>
    </header>

    <div class="summary-card">
      <div class="stat-pill">
        <div class="stat-val" id="totalCount">-</div>
        <div class="stat-label">Total Tests</div>
      </div>
      <div class="stat-pill">
        <div class="stat-val passed" id="passedCount">-</div>
        <div class="stat-label">Passed</div>
      </div>
      <div class="stat-pill">
        <div class="stat-val failed" id="failedCount">-</div>
        <div class="stat-label">Failed</div>
      </div>
      <div class="stat-pill" style="display: flex; align-items: center; justify-content: center;">
        <button class="btn" onclick="runSuite()">Rerun Tests</button>
      </div>
    </div>

    <table class="test-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Test Name / Boundary Condition</th>
          <th>Expected</th>
          <th>Engine Result</th>
          <th>Rule Fired</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="testRows">
        <!-- Rendered by JS -->
      </tbody>
    </table>

    <div class="disclaimer-box" id="disclaimerText">
      Verifying clinical disclaimer...
    </div>

    <a href="../index.html" class="back-link">&larr; Back to PostCare App</a>
  </div>

  <script src="../js/triageRules.js"></script>
  <script src="./triage.test.js"></script>
  <script>
    function runSuite() {
      const rows = document.getElementById("testRows");
      rows.innerHTML = "";
      let pass = 0;
      let fail = 0;

      testCases.forEach((tc, idx) => {
        const res = evaluateTriage(tc.input, tc.prev);
        const isOk = res.level === tc.expectedLevel && res.ruleId === tc.expectedRule;
        if (isOk) pass++; else fail++;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td><strong>${tc.name}</strong></td>
          <td><span class="badge level-${tc.expectedLevel}">${tc.expectedLevel} (${tc.expectedRule})</span></td>
          <td><span class="badge level-${res.level}">${res.level}</span></td>
          <td><code>${res.ruleId}</code>: ${res.whyLine}</td>
          <td><span class="badge ${isOk ? 'pass' : 'fail'}">${isOk ? 'PASS' : 'FAIL'}</span></td>
        `;
        rows.appendChild(tr);
      });

      document.getElementById("totalCount").textContent = testCases.length;
      document.getElementById("passedCount").textContent = pass;
      document.getElementById("failedCount").textContent = fail;
      document.getElementById("disclaimerText").innerHTML = `
        <strong>Mandatory Clinical Disclaimer Verified:</strong><br>
        <em>"${CLINICAL_DISCLAIMER}"</em>
      `;
    }

    window.addEventListener("DOMContentLoaded", runSuite);
  </script>
</body>
</html>
